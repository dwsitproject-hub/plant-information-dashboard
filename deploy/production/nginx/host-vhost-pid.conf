# Host nginx vhost for http://pid.kpndomain.com on the FE server 172.28.80.50 (guide §11).
#
# THIS NGINX IS THE SHARED FRONT DOOR FOR EVERY APP ON THE SERVER. Install it only with
#   /opt/pid/src/deploy/production/nginx/install-host-vhost.sh
# which checks the other sites first, runs nginx -t (and puts everything back if it fails), reloads, and
# then compares every other site's answer before and after.
#
# Why this block cannot take traffic from another app:
# - It answers ONE exact name. nginx picks the server by the Host header; an exact name only ever matches
#   itself, so dwshub.kpndomain.com, test-*.kpndomain.com or any *.kpndomain.com wildcard elsewhere keep
#   reaching their own blocks.
# - Never default_server: requests for unknown names keep going wherever they went before.
# - Port 80 only. It adds no 443 server, so nothing changes for the HTTPS sites (the Hub).
# - `listen 80;` must be the same form the other sites use. If they listen on an address
#   (`listen 172.28.80.50:80;`), a plain `listen 80;` block is never consulted for that address - the
#   installer stops and says so. Do not add `[::]:80` unless the other sites listen on IPv6 too: on a host
#   without IPv6, nginx -t fails.

server {
    listen 80;
    server_name pid.kpndomain.com;
    server_tokens off;

    # The app takes small JSON bodies only.
    client_max_body_size 2m;

    # This app's own log files, so its traffic never mixes into another site's.
    access_log /var/log/nginx/pid.access.log;
    error_log  /var/log/nginx/pid.error.log warn;

    location / {
        # The app's web container, on this server's private address (fe.compose.yml).
        proxy_pass http://172.28.80.50:3091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;          # required, or the session cookie breaks
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # the container trusts only this hop for it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Later, with TLS (guide §11.2): a `listen 443 ssl;` server for this name carrying a certificate that covers
# pid.kpndomain.com and this location, and this port-80 server reduced to
# `return 301 https://$host$request_uri;`.
