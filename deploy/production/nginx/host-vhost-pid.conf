# Host nginx vhost for http://pid.kpndomain.com on the FE server 172.28.80.50 - LATER, when the DNS
# record exists (guide §8 and §11). Until then users open http://172.28.80.50:3091 directly.
# Install:
#   cp /opt/pid/src/deploy/production/nginx/host-vhost-pid.conf /etc/nginx/conf.d/pid.conf
#   nginx -t && systemctl reload nginx        (nginx -t is NOT optional: this nginx is shared)
# Never default_server: unknown host names must keep reaching whatever answered before.
# Then set APP_PUBLIC_ORIGIN, CORS_ORIGIN and OIDC_REDIRECT_URI to the new address (guide §11).

server {
    listen 80;
    listen [::]:80;
    server_name pid.kpndomain.com;
    server_tokens off;

    # The app takes small JSON bodies only.
    client_max_body_size 2m;

    location / {
        # The app's web container, on this server's private address (fe.compose.yml).
        proxy_pass http://172.28.80.50:3091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;          # required, or the session cookie breaks
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # the container trusts only this hop for it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# With TLS (guide §11): a `listen 443 ssl;` server carrying the certificate (the one the Hub uses, if
# its SAN covers pid.kpndomain.com) and this location, and the port-80 server reduced to
# `return 301 https://$host$request_uri;`.
