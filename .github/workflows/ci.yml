name: CI

on:
  push:
    branches: [main, sit, UAT]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pid
          POSTGRES_PASSWORD: pid
          POSTGRES_DB: pid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pid -d pid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pid:pid@localhost:5432/pid
      JWT_SECRET: ci-only-secret
      APP_ENV: dev
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Migrations apply to an empty database
        run: npm run migrate
      - name: Migrations are a no-op the second time
        run: npm run migrate
      - name: Dev seed loads on top
        run: npm run seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
